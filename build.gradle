buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "github"
            url = "https://github.com/juanmuscaria/maven/raw/master"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)'
    }
}

apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group
archivesBaseName = mod_archives_name

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    // Single-sourced from gradle.properties - see the ceiling note on forge_version there.
    version = "${mc_version}-${forge_version}"
    mappings = "stable_39"
    runDir = "eclipse"

    replace '@VERSION@', project.version
    replaceIn 'CavesAndCliffsBackport.java'
}

repositories {
    flatDir { dirs 'deps' }
    // CurseMaven serves CurseForge files by project and file id, so the version is pinned exactly.
    maven { url 'https://cursemaven.com' }
}

dependencies {
    // Backport Core, required. Its MCP-named dev jar sits in deps/ (copied from BackportCore's build/libs).
    // Plain compile, never deobfCompile: flatDir matches by file name, so deobfCompile would hand
    // ForgeGradle the SRG-named jar and every override of a Minecraft method would fail to compile.
    compile name: "BackportCore-${core_version}-dev"
    // Fluidlogged API 3.3.3 (CurseForge 485654, file 8445863): optional. With it installed, Backport Core's waterlog
    // API lets our Waterloggable blocks hold water; without it they place dry. Compiled against, never bundled;
    // -PnoFluidlogged (below) runs without it.
    deobfCompile 'curse.maven:fluidlogged-api-485654:8445863'
    // Cubic Chunks 1.12.2-0.0.1301 (CurseForge 292243, file 9027901): optional. Package `cubic` compiles against its
    // API and is only loaded with it installed; never bundled. -Pcubicchunks puts it on the run tasks' classpath.
    if (project.hasProperty('cubicchunks')) {
        deobfCompile 'curse.maven:cubicchunks-292243:9027901'
    } else {
        deobfProvided 'curse.maven:cubicchunks-292243:9027901'
    }
}

// Headless self-tests live in src/selftest/java and are compiled in only for a test run:
//
//     ./gradlew runServer -Pselftest=deepslate
//
// The value names the stream to test ("all" runs every one). The tests never reach a release jar:
// without the property the directory is not a source directory at all, and the jar excludes the
// package in case a test build's classes are still in build/classes. A test run needs them IN the jar,
// because FG2's runServer runs from the jar - which is one more reason a release is built last.
def selftest = project.findProperty('selftest')
// A client-side test (./gradlew runClient -Pclienttest=height) uses the same test sources, under its own property:
// the server-side runner stops the server it runs on, which in single player is the client's integrated server.
def clienttest = project.findProperty('clienttest')
if (selftest || clienttest) {
    sourceSets.main.java.srcDir 'src/selftest/java'
} else {
    jar {
        exclude 'com/exiledradio/cavesandcliffsbackport/selftest/**'
    }
}

// The run tasks always run: a dev server is how this mod is tested, and Gradle deciding a run is
// UP-TO-DATE skips the test. Never use cleanRunServer to force one - it deletes eclipse/, worlds,
// configs and all.
// The extended-height coremod (package height.asm, docs/EXTENDED_HEIGHT.md). A release jar names it in its manifest,
// with FMLCorePluginContainsFMLMod so the mod stays one jar; the dev run tasks name it with fml.coreMods.load, since
// they run the mod from the classpath.
def coremod = 'com.exiledradio.cavesandcliffsbackport.height.asm.HeightCorePlugin'
jar {
    manifest {
        attributes 'FMLCorePlugin': coremod,
                'FMLCorePluginContainsFMLMod': 'true'
    }
}

// -Pcubicchunks: Cubic Chunks is a Mixin coremod. In the dev run its coremod is named like ours, its MixinTweaker
// is added, and its refmap (SRG names) is remapped to the dev environment's MCP names.
def cubic = project.hasProperty('cubicchunks')
def srgMcp = "${gradle.gradleUserHomeDir}/caches/minecraft/de/oceanlabs/mcp/mcp_stable/39/1.12.2/srgs/srg-mcp.srg"
[runServer, runClient].each { task ->
    task.systemProperty 'fml.coreMods.load', cubic
            ? coremod + ',io.github.opencubicchunks.cubicchunks.core.asm.coremod.CubicChunksCoreMod' : coremod
    if (cubic) {
        task.systemProperty 'mixin.env.remapRefMap', 'true'
        task.systemProperty 'mixin.env.refMapRemappingFile', srgMcp
        task.args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
    }
    task.outputs.upToDateWhen { false }
    if (selftest) {
        task.systemProperty 'cavesandcliffsbackport.selftest', selftest
    }
    if (clienttest) {
        task.systemProperty 'cavesandcliffsbackport.clienttest', clienttest
    }
}

processResources {
    // Gradle does not treat `expand` values as task inputs, so without declaring them here the task
    // stays UP-TO-DATE across a version bump and the jar ships an mcmod.info still claiming the
    // previous version.
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_author', mod_author
    inputs.property 'mod_description', mod_description
    inputs.property 'mod_credits', mod_credits
    inputs.property 'mod_url', mod_url
    inputs.property 'mc_version', mc_version
    inputs.property 'mod_version', mod_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version,
                'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_author': mod_author,
                'mod_description': mod_description,
                'mod_credits': mod_credits,
                'mod_url': mod_url,
                'mc_version': mc_version,
                'mod_version': mod_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

task devJar(type: Jar) {
    classifier = 'dev'
    from sourceSets.main.output
    exclude 'com/exiledradio/cavesandcliffsbackport/selftest/**'
}

task sourcesJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
    exclude 'com/exiledradio/cavesandcliffsbackport/selftest/**'
}

artifacts {
    archives devJar
    archives sourcesJar
}

// Dev convenience: copies the built jar into a local test instance. Opt-in and machine-local: set
// `ccbDeployDir` in ~/.gradle/gradle.properties. It is deliberately NOT the `deployDir` property the
// other mods in this workspace read, so a machine-wide deployDir never sends this mod's jar into an
// instance by accident.
def deployDir = project.findProperty('ccbDeployDir')

task deployToInstance(type: Copy) {
    onlyIf { deployDir && file(deployDir).isDirectory() }

    // Clear out earlier builds of this mod first: the jar name carries the version, so a bump would
    // otherwise leave the old jar beside the new one, and FML crashes on a duplicate mod id.
    doFirst {
        if (deployDir && file(deployDir).isDirectory()) {
            file(deployDir).listFiles()?.each { f ->
                if (f.name ==~ /^${archivesBaseName}-.*\.jar$/) {
                    logger.lifecycle("Removing previous build: ${f.name}")
                    f.delete()
                }
            }
        }
    }

    from jar.archivePath
    into deployDir ?: "$buildDir/deploy"
    rename { "${archivesBaseName}-${project.version}.jar" }
}

deployToInstance.dependsOn reobfJar

// reobfJar rewrites the jar in place, which Gradle cannot see, so it can decide there is nothing to
// do and leave a jar with development names in it. That jar works in runClient and crashes a real
// instance with NoSuchMethodError on the first Minecraft method it calls. Always run it - and always
// build LAST: any run task afterwards rewrites build/libs with an unmapped jar.
reobfJar.outputs.upToDateWhen { false }
build.finalizedBy deployToInstance

// -PnoFluidlogged: runClient and runServer without Fluidlogged API on the classpath, to test the mod as a game
// without it (nothing holds water). The classes are compiled as usual (against it), exactly as the release jar is.
if (project.hasProperty('noFluidlogged')) {
    afterEvaluate {
        [runClient, runServer].each { task ->
            task.classpath = task.classpath.filter { !it.name.contains('fluidlogged') }
        }
    }
}

// -PrunJars=<jar>[;<jar>...]: extra jars on the runClient/runServer class path, for a dev run that needs a coremod
// loaded before eclipse/mods is read (MixinBooter for Hesperus: tools/height/phosphor-selftest.sh). FG2's GradleStart
// finds coremods on the class path by their manifests.
if (project.hasProperty('runJars')) {
    afterEvaluate {
        [runClient, runServer].each { task ->
            task.classpath += files(project.property('runJars').toString().split(';'))
        }
    }
}
